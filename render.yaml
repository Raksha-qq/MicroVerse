services:
  # MICROVERSE Backend Web Service
  - type: web
    name: microverse-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: microverse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_MAX
        value: 300

databases:
  # Hosted Managed PostgreSQL Database
  - name: microverse-db
    plan: starter
    databaseName: microverse
    user: microverse_admin

